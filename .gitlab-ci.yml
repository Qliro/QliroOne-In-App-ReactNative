include:
  - template: Security/SAST.gitlab-ci.yml

stages:
  - test
  - build

# Run on merge requests and on main.
.mr-or-main: &mr-or-main
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: always
  - if: $CI_COMMIT_BRANCH == "main"
    when: always
  - when: never

# The native example builds are the expensive jobs on the shared macOS runners, so on merge
# requests they only run when something they compile actually changed. Every push to main builds
# both regardless, so a bad merge is caught even if the MR pipeline skipped them.
.native-changes: &native-changes
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
      - package.json
      - yarn.lock
      - turbo.json
      - "*.podspec"
      - src/**/*
      - android/**/*
      - ios/**/*
      - example/**/*
      - .gitlab-ci.yml
    when: always
  - if: $CI_COMMIT_BRANCH == "main"
    when: always
  - when: never

.node:
  # Matches .nvmrc, which asked for 22 while this pinned 20. React Native 0.86 accepts either
  # (^20.19.4 || ^22.13.0 || ...), but two answers to "which node" is one too many.
  image: node:22
  interruptible: true
  before_script:
    - corepack enable || npm install -g yarn
    # --immutable, not --frozen-lockfile: that is the yarn 1 spelling, and yarn 4 only tolerates it.
    - yarn install --immutable
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/

# Native builds run on the same self-hosted macOS runners as the iOS and Android SDK repos, so
# Xcode, the Android SDK and a Node toolchain are already on the box — only the JS dependencies
# are installed here. yarn comes from .yarn/releases via corepack; the npm fallback covers runners
# where corepack is not enabled.
#
# The box is shared and configured by hand, and its toolchain versions are what break these jobs:
# the shell profile selects node 16 while .nvmrc asks for 22, and its ruby decides which
# activesupport versions rubygems will even show bundler (see example/Gemfile). Both surfaced as
# errors that named neither node nor ruby, so the versions get printed up front — a job that fails
# on a toolchain mismatch should say so in its first ten lines.
# macOS runner — reserved for the one job that genuinely needs it (build-ios). Everything else runs
# on the docker runners so a wedged or busy Mac mini cannot stall the whole pipeline.
.native:
  tags:
    - app
  interruptible: true
  before_script:
    - |
      # Best-effort: prefer the node .nvmrc names (react-native 0.81 wants >= 20) when this runner
      # has nvm. Never fail the job over it — a mismatch is worth a warning, not a red pipeline.
      export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
      if [ -s "$NVM_DIR/nvm.sh" ]; then
        # shellcheck disable=SC1091
        . "$NVM_DIR/nvm.sh" >/dev/null 2>&1 || true
        nvm install >/dev/null 2>&1 || nvm use >/dev/null 2>&1 || true
      fi
      echo "node    $(node --version 2>/dev/null || echo '<missing>')  (.nvmrc: $(cat .nvmrc 2>/dev/null))"
      echo "npm     $(npm --version 2>/dev/null || echo '<missing>')"
      echo "ruby    $(ruby -v 2>/dev/null || echo '<missing>')"
      echo "bundler $(bundle -v 2>/dev/null || echo '<missing>')"
      echo "java    ${JAVA_HOME:-<JAVA_HOME unset>}"
      case "$(node --version 2>/dev/null)" in
        v1[0-9].*) echo "warning: node $(node --version) is older than react-native 0.86 supports" >&2 ;;
      esac
    - corepack enable || npm install -g yarn
    - yarn install --immutable
  cache:
    - key:
        files:
          - yarn.lock
      paths:
        - node_modules/
        - example/node_modules/

semgrep-sast:
  stage: test
  image: registry.gitlab.com/security-products/semgrep:5
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
      allow_failure: false
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

typecheck:
  extends: .node
  stage: test
  script:
    - yarn typecheck
  rules: *mr-or-main

lint:
  extends: .node
  stage: test
  script:
    - yarn lint
  rules: *mr-or-main

unit-test:
  extends: .node
  stage: test
  script:
    - yarn test --coverage --maxWorkers=2
  # Coverage thresholds live in package.json (jest.coverageThreshold), so a drop fails the job
  # rather than only showing up in the report. The cobertura report drives the per-line coverage
  # annotations in the MR diff; the regex feeds the pipeline coverage number.
  coverage: '/Statements\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  rules: *mr-or-main

# Checks that the native SDK versions this package pins are actually published and resolvable from
# the public registries a merchant's build reaches for: Maven Central for `com.qliro:qliroone` and
# the CocoaPods trunk for `QliroOne`.
#
# Neither existing job covers this. build-android resolves the Android coordinate through a
# composite-build substitution (example/android/settings.gradle swaps it for project(':qliroone')),
# so it passes no matter what the pin says; build-ios does exercise the pod pin, but it is
# allow_failure. An unresolvable pin therefore reaches merchants as a build error in *their* app,
# with nothing red in this pipeline. That is what shipped before, and this job is the gate for it.
#
# !!! NON-BLOCKING ONLY UNTIL THE 3.0.0 NATIVES ARE PUBLISHED !!!
# `allow_failure: true` below is temporary and is expected to fail today: the suite pins 3.0.0 and
# neither native has released yet. THIS JOB MUST BECOME BLOCKING (delete the `allow_failure` line)
# as soon as com.qliro:qliroone 3.0.0 is on Maven Central and QliroOne 3.0.0 is on the CocoaPods
# trunk. Leaving it non-blocking after that point restores exactly the hole it was added to close.
native-pin-check:
  stage: test
  image: node:22
  interruptible: true
  allow_failure: true
  rules: *mr-or-main
  script:
    - |
      set -u
      if ! command -v curl >/dev/null; then
        echo "error: curl is not available in this image; cannot check the registries" >&2
        exit 1
      fi

      # Read the pins from the files that actually define them, so this can never drift from them.
      android_pin="$(sed -n 's/^QlirooneReactnative_qliroOneVersion=//p' android/gradle.properties | tr -d '[:space:]')"
      ios_pin="$(sed -n 's/.*s\.dependency[[:space:]]*"QliroOne",[[:space:]]*"\([^"]*\)".*/\1/p' QlirooneReactnative.podspec | tr -d '[:space:]')"

      echo "Pinned native SDK versions"
      echo "  Android  com.qliro:qliroone  = ${android_pin:-<could not parse>}   (android/gradle.properties)"
      echo "  iOS      QliroOne            = ${ios_pin:-<could not parse>}   (QlirooneReactnative.podspec)"
      echo

      # A failed parse must be loud. Silently treating an unreadable pin as "nothing to check" would
      # make this job green for the one reason it exists to catch.
      if [ -z "$android_pin" ] || [ -z "$ios_pin" ]; then
        echo "FAIL: could not read one or both pins from their source files." >&2
        echo "      This is a bug in this job's parsing, not necessarily a bad pin — fix the sed" >&2
        echo "      expressions above if the file format changed." >&2
        exit 1
      fi

      failed=0

      # --- Android: Maven Central -------------------------------------------------------------
      # The .pom is the smallest artifact that must exist for Gradle to resolve the coordinate.
      maven_url="https://repo1.maven.org/maven2/com/qliro/qliroone/${android_pin}/qliroone-${android_pin}.pom"
      maven_code="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 "$maven_url" 2>/dev/null || echo 000)"
      if [ "$maven_code" = "200" ]; then
        echo "PASS  Android  com.qliro:qliroone:${android_pin} is resolvable from Maven Central."
      else
        failed=1
        echo "FAIL  Android  com.qliro:qliroone:${android_pin} is NOT resolvable from Maven Central." >&2
        echo "               GET ${maven_url}" >&2
        if [ "$maven_code" = "404" ]; then
          echo "               -> HTTP 404: that exact version is not published." >&2
          echo "               -> Fix: publish it, or correct QlirooneReactnative_qliroOneVersion" >&2
          echo "                  in android/gradle.properties." >&2
        elif [ "$maven_code" = "000" ]; then
          echo "               -> No HTTP response (network/DNS/proxy). Cannot judge the pin from" >&2
          echo "                  this runner; this is an infrastructure failure, not a bad pin." >&2
        else
          echo "               -> HTTP ${maven_code} (unexpected)." >&2
        fi
      fi

      # --- iOS: CocoaPods trunk ---------------------------------------------------------------
      # The trunk API lists every published version of a pod. Parsed with node (present in this
      # image) rather than grepped, so JSON whitespace cannot produce a wrong answer either way.
      trunk_url="https://trunk.cocoapods.org/api/v1/pods/QliroOne"
      trunk_code="$(curl -sS -o /tmp/trunk.json -w '%{http_code}' -L --max-time 30 "$trunk_url" 2>/dev/null || echo 000)"
      if [ "$trunk_code" = "200" ]; then
        verdict="$(node -e '
          const fs = require("fs");
          const want = process.argv[1];
          try {
            const j = JSON.parse(fs.readFileSync("/tmp/trunk.json", "utf8"));
            const versions = (j.versions || []).map((v) => v.name);
            process.stdout.write(versions.includes(want) ? "yes" : "no|" + versions.slice(-8).join(", "));
          } catch (e) {
            process.stdout.write("unparseable");
          }
        ' "$ios_pin")"
      else
        verdict="http|${trunk_code}"
      fi

      case "$verdict" in
        yes)
          echo "PASS  iOS      QliroOne ${ios_pin} is published on the CocoaPods trunk."
          ;;
        no\|*)
          failed=1
          echo "FAIL  iOS      QliroOne ${ios_pin} is NOT published on the CocoaPods trunk." >&2
          echo "               The pod exists; that version does not. Most recent published:" >&2
          echo "               ${verdict#no|}" >&2
          echo "               -> Fix: publish it (pod trunk push), or correct the s.dependency" >&2
          echo "                  version in QlirooneReactnative.podspec." >&2
          echo "               -> example/ios/Podfile and ../qliro-one-hats/ios/Podfile pin the" >&2
          echo "                  same version and must be changed together with it." >&2
          ;;
        http\|404)
          failed=1
          echo "FAIL  iOS      The pod name 'QliroOne' is not registered on the CocoaPods trunk." >&2
          echo "               GET ${trunk_url} -> HTTP 404. Check the name in the podspec." >&2
          ;;
        *)
          failed=1
          echo "FAIL  iOS      Could not determine whether QliroOne ${ios_pin} is published." >&2
          echo "               GET ${trunk_url} -> ${verdict}" >&2
          echo "               No usable response from the trunk API; this is likely an" >&2
          echo "               infrastructure failure rather than a bad pin." >&2
          ;;
      esac

      echo
      if [ "$failed" -ne 0 ]; then
        echo "One or more native pins are not resolvable (see FAIL lines above)." >&2
        echo "While this job is allow_failure, a red result here means merchants installing this" >&2
        echo "package cannot build. Do not release until it is green." >&2
        exit 1
      fi
      echo "All native pins resolve from their public registries."

# Mirrors the build-library job from the old GitHub CI: proves the published artifact (bob output
# plus the generated typings) still builds, which lint and typecheck do not cover.
build-library:
  extends: .node
  stage: build
  script:
    - yarn prepare
  artifacts:
    expire_in: 1 week
    paths:
      - lib/
  rules: *mr-or-main

# Runs on the shared docker runners, not the Mac mini — an Android build needs a JDK and an Android
# SDK, not macOS, and the Mac mini is a single shared shell box whose queue serializes every tagged
# job. Moving off it also fixes a real defect: example/android/settings.gradle composite-builds
# ../../qliro-one-android, which on the shared shell runner resolved to whatever checkout that
# repo's *own* last CI job left behind — any ref, any age. Here the sibling is cloned explicitly at
# a pinned ref, so the native SDK the bridge compiles against is chosen, not inherited.
build-android:
  image: node:22
  stage: build
  interruptible: true
  variables:
    TURBO_CACHE_DIR: .turbo/android
    JAVA_OPTS: "-XX:MaxHeapSize=6g"
    ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
    ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
    # The native-SDK ref the composite build compiles against. Bump deliberately when the Android
    # repo's integration branch moves. The v3 stack merged to main on 2026-09-03.
    QLIRO_ONE_ANDROID_REF: main
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openjdk-17-jdk-headless unzip > /dev/null
    - export JAVA_HOME=$(dirname $(dirname $(readlink -f "$(command -v java)")))
    - |
      if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
    - '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null'
    # The sibling native SDK the composite build includes. Job-token access must be allowlisted on
    # qliro-one-android (Settings > CI/CD > Job token permissions) for this clone to work.
    - rm -rf ../qliro-one-android
    - git clone --depth 1 --branch "$QLIRO_ONE_ANDROID_REF" "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/web-app/qliro-one-sdks/qliro-one-android.git" ../qliro-one-android
    - corepack enable || npm install -g yarn
    - yarn install --immutable
  script:
    - yarn turbo run build:android --cache-dir="$TURBO_CACHE_DIR"
    # The bridge's Robolectric unit tests. Run here rather than as a sibling job because they need
    # exactly what this job already has: example/android/settings.gradle pulls ../../qliro-one-android
    # in as a composite build and substitutes com.qliro:qliroone with project(':qliroone'), so the
    # tests execute against the real native SDK, and a separate job would have to reproduce that
    # whole checkout and Gradle warm-up for four tests.
    #
    # This is the only gate on the bridge's Kotlin logic — `yarn test` covers the JS side only, and
    # the Android build compiles the bridge without exercising it. It exists because the bridge once
    # wired the `enableCheckoutScrolling` command to the SDK's `isScrollEnabled` property (two
    # different APIs with near-identical names), which broke scroll-to-selection and self-sizing and
    # was caught by hand, not by CI.
    - cd example/android
    - ./gradlew :qliro_react-native-qliro-one:testDebugUnitTest --console=plain
    - cd ../..
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      # Surfaces a failing bridge test in the MR widget instead of only in the job log.
      junit: android/build/test-results/testDebugUnitTest/TEST-*.xml
  cache:
    - key:
        files:
          - yarn.lock
      paths:
        - node_modules/
        - example/node_modules/
    - key: rn-turbo-android
      paths:
        - .turbo/android
    - key: rn-android-sdk-36
      paths:
        - .android-sdk/
    - key:
        files:
          - example/android/gradle/wrapper/gradle-wrapper.properties
      paths:
        - .gradle-home/wrapper/
        - .gradle-home/caches/modules-2/
  rules: *native-changes

build-ios:
  extends: .native
  stage: build
  # Non-blocking for now, for exactly one reason: QlirooneReactnative.podspec and
  # example/ios/Podfile pin `QliroOne` 3.0.0, and that version is not published to the CocoaPods
  # trunk yet. `pod install` therefore cannot resolve it and the job dies before it compiles
  # anything, with "cannot find compatible versions for pod QliroOne".
  #
  # TO REMOVE allow_failure, the single condition is: **QliroOne 3.0.0 must be live on the
  # CocoaPods trunk** (`pod trunk info QliroOne` lists 3.0.0, i.e. the `native-pin-check` job below
  # passes its iOS half). Nothing else is outstanding — the bridge APIs this job compiles
  # (`isDebugEnabled`, `loadTimeoutMs`, `additionalAllowedUrlSchemes`) all exist in the iOS SDK's
  # 3.0.0 source; only its publication is pending. Once that lands, delete this comment and the
  # `allow_failure` line so a genuine iOS compile break blocks the pipeline again.
  allow_failure: true
  variables:
    TURBO_CACHE_DIR: .turbo/ios
    # The old GitHub CI also set RCT_USE_RN_DEP / RCT_USE_PREBUILT_RNCORE to link the prebuilt React
    # Native core. Those flags change the resolved pod graph, so `pod install` rewrites
    # example/ios/Podfile.lock; turning them on here means regenerating and committing that lock
    # first, otherwise CI builds a different dependency set than developers do.
    #
    # CocoaPods aborts with Encoding::CompatibilityError when the shell has no UTF-8 locale, which
    # is the default on a bare shell runner.
    LANG: en_US.UTF-8
    LC_ALL: en_US.UTF-8
  script:
    - cd example
    - bundle config set --local path vendor/bundle
    - bundle install
    - bundle exec pod install --project-directory=ios
    - cd ..
    - yarn turbo run build:ios --cache-dir="$TURBO_CACHE_DIR"
  cache:
    - key:
        files:
          - yarn.lock
      paths:
        - node_modules/
        - example/node_modules/
    - key: rn-turbo-ios
      paths:
        - .turbo/ios
    - key:
        files:
          - example/ios/Podfile.lock
      paths:
        - example/vendor/bundle/
        - example/ios/Pods/
  rules: *native-changes
