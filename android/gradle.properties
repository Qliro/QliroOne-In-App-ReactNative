# Defaults for a consumer that does not set these in its own rootProject.ext. They track the React
# Native template so a stock app agrees with the library without configuring anything.
QlirooneReactnative_kotlinVersion=2.1.20
QlirooneReactnative_minSdkVersion=24
# 36 matches both the native SDK (../qliro-one-android/qliroone/build.gradle) and the example app.
# Google Play has required targetSdk 35 since August 2025 and requires 36 from August 2026; these
# are only the fallbacks for a consumer whose root project sets no ext, but a library shipping a
# lower targetSdk than its host drags the merged manifest down, so they track the current floor.
QlirooneReactnative_targetSdkVersion=36
QlirooneReactnative_compileSdkVersion=36
QlirooneReactnative_ndkVersion=27.1.12297006

# Native Android SDK (com.qliro:qliroone) this bridge compiles against.
#
# 3.0.0 is the coordinate the native Android SDK releases alongside this package — the whole suite
# (Android, iOS, React Native) ships 3.0.0 together. It is NOT yet on Maven Central at the time of
# writing, so an external consumer building against this pin before the native release will fail to
# resolve it. The in-repo host apps (example/, ../../qliro-one-hats) are unaffected: their
# settings.gradle substitutes this coordinate with project(':qliroone') from a composite build and
# never resolves it.
#
# The `native-pin-check` job in .gitlab-ci.yml verifies this coordinate is actually resolvable from
# Maven Central.
QlirooneReactnative_qliroOneVersion=3.0.0-SNAPSHOT
