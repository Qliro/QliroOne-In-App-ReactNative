buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP is pinned instead of taking React Native's default (8.11.0) because the native
        // Android SDK is included as a composite build and needs 8.13.0 for its publish plugin.
        // Gradle forbids two AGP versions in one build, so both sides must agree.
        classpath("com.android.tools.build:gradle:8.13.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// The Central Portal snapshot repository, for building against a pre-release native SDK
// (-PqliroUseLocalSdk=false with a -SNAPSHOT pin in ../../android/gradle.properties). Repositories
// declared inside a library module do not apply to the app's own dependency resolution, so this
// must live at the app level — a merchant testing a dev build adds the same block. Appended after
// google()/mavenCentral(), so release builds never query it.
allprojects {
    repositories {
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}
